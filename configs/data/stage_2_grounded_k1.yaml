# Stage 2 with grounded prompts: one prompt per row, rewritten from the source
# filename label (all label words + orientation + block/item preserved, colour/
# shape inferred from the label). Dynamic Qwen3-8B multi-layer encoding.
stage: mc_modrinth_grounded_k1

dataset:
  images: data/build/mc_text2image32_wl/images.uint8.mmap
  metadata: data/build/mc_text2image32_wl/metadata.parquet
  splits: data/build/mc_text2image32_wl/splits.json
  image_size: 32
  toroidal: true
  normalize: true
  channels: 4
  prompt_views: data/build/mc_text2image32_wl/grounded_prompts.parquet
  prompt_cols: [prompt_0]
  text_dim: 12288
  max_text_tokens: 512
