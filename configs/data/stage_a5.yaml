stage: pixel_bridge

build:
  out_dir: data/build/pixel_a5
  generic_dir: data/build/generic
  kenney_dir: data/raw/kenney
  oga_dir: data/raw/oga
  target_size: 32
  total_target: 100000
  mix:
    pseudo_pixel_frac: 0.7
    kenney_frac: 0.2
    oga_frac: 0.1
  pixel_modes:
    direct_lowres: 0.4
    palette_quant: 0.3
    pixelized_quant: 0.2
    raw: 0.1
  palette_sizes: [8, 16, 32, 64]
  seed: 0

dataset:
  images: data/build/pixel_a5/images.uint8.mmap
  metadata: data/build/pixel_a5/metadata.parquet
  splits: data/build/pixel_a5/splits.json
  image_size: 32
  toroidal: false
  normalize: true
  channels: 4
  text_mmap: ""
  text_dim: 768
  max_text_tokens: 64
  caption_col: weak_prompt