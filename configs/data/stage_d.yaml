stage: vlm_finetune

build:
  out_dir: data/build/mc_d
  mc_build: data/build/mc_b
  captions: data/build/mc_d/detailed_captions.jsonl
  text_encoder_config: configs/text_encoder.yaml
  text_encoder: "Qwen/Qwen3-VL-Embedding-8B"
  text_dim: 4096
  max_text_tokens: 1
  cond_dropout: 0.12
  seed: 0

dataset:
  images: data/build/mc_d/images.uint8.mmap
  metadata: data/build/mc_d/metadata.parquet
  splits: data/build/mc_d/splits.json
  image_size: 32
  toroidal: false
  normalize: true
  channels: 4
  text_mmap: data/build/mc_d/text_embeddings.f32.mmap
  text_dim: 4096
  max_text_tokens: 1
  caption_col: detailed_caption