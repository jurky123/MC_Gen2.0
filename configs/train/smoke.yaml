train:
  precision: bf16
  compile: false

  seed: 0
  steps: 5000
  log_every: 25
  save_every: 1000
  val_every: 500
  output_dir: checkpoints/smoke

  optimizer:
    name: adamw
    fused: false
    lr: 3.0e-4
    betas: [0.9, 0.95]
    weight_decay: 0.03

  scheduler:
    type: cosine
    warmup_steps: 100

  grad_clip: 1.0
  activation_checkpointing: false
  gradient_accumulation: 2

  batch:
    auto_probe: false
    preferred_micro_batch: 16
    max_vram_gb: 7.2

  ema:
    enabled: true
    device: cpu
    decay: 0.9999
    update_every: 8

  flow:
    timestep_sampling: uniform
    loss: mse

  tile_loss:
    enabled: true
    weight: 0.03
    max_t: 0.7
    border_width: 2

  dataset: configs/data/stage_a.yaml
  text_mmap: ""