train:
  precision: bf16
  compile: false

  seed: 0
  steps: 6
  log_every: 1
  save_every: 5
  eval_every_epochs: 10
  output_dir: checkpoints/smoke_rgba

  optimizer:
    name: adamw
    fused: true
    lr: 3.0e-4
    betas: [0.9, 0.95]
    weight_decay: 0.03

  scheduler:
    type: cosine
    warmup_steps: 2

  grad_clip: 1.0
  activation_checkpointing: false
  gradient_accumulation: 2

  batch:
    auto_probe: true
    preferred_micro_batch: 8
    max_vram_gb: 7.0

  ema:
    enabled: true
    device: cpu
    decay: 0.999
    update_every: 1

  flow:
    timestep_sampling: uniform
    loss: mse

  tile_loss:
    enabled: true
    weight: 0.03
    max_t: 0.7
    border_width: 2

  dataset: configs/data/stage_1.yaml
