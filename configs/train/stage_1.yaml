train:
  precision: bf16
  compile: true

  seed: 0
  # 3,004,255 train samples / (micro-batch 16 x grad_accum 8 = 128) = 23,471 steps per epoch.
  # Ten full epochs ensure the epoch-10 evaluation is executed.
  steps: 234710
  log_every: 25
  save_every: 2000
  eval_every_epochs: 10
  output_dir: checkpoints/stage_1
  log_file: checkpoints/stage_1/train.log

  optimizer:
    name: adamw
    fused: true
    lr: 3.0e-4
    betas: [0.9, 0.95]
    weight_decay: 0.03

  scheduler:
    type: cosine
    warmup_steps: 1000

  grad_clip: 1.0
  activation_checkpointing: false
  gradient_accumulation: 1

  batch:
    auto_probe: true
    preferred_micro_batch: 256
    max_vram_gb: 76

  ema:
    enabled: true
    device: cpu
    decay: 0.999
    update_every: 1

  flow:
    timestep_sampling: uniform
    loss: mse

  tile_loss:
    enabled: true
    weight: 0.03
    max_t: 0.7
    border_width: 2

  dataset: configs/data/stage_1.yaml
