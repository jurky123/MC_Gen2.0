train:
  precision: bf16
  compile: true

  seed: 0
  # Clean Stage 1 run from scratch with toroidal roll augmentation on the train
  # split (~20 epochs at effective batch 1024). Validate every epoch and keep
  # the best-val checkpoint in checkpoints/stage_1_clean/best.pt.
  steps: 58893
  log_every: 25
  save_every: 2000
  eval_every_epochs: 1
  save_best: true
  output_dir: checkpoints/stage_1_clean
  log_file: checkpoints/stage_1_clean/train.log

  optimizer:
    name: adamw
    fused: true
    lr: 3.0e-4
    betas: [0.9, 0.95]
    weight_decay: 0.03

  scheduler:
    type: cosine
    warmup_steps: 1000

  grad_clip: 1.0
  activation_checkpointing: false
  gradient_accumulation: 1

  batch:
    auto_probe: false
    preferred_micro_batch: 1024
    max_vram_gb: 74

  ema:
    enabled: true
    device: cpu
    decay: 0.999
    update_every: 1

  flow:
    timestep_sampling: uniform
    loss: mse

  tile_loss:
    enabled: true
    weight: 0.03
    max_t: 0.7
    border_width: 2

  dataset: configs/data/stage_1.yaml
  text_mmap: ""
