train:
  precision: bf16
  compile: true

  seed: 0
  # Stage 2: MC weak-label alignment. ~1.04M samples / batch 1024 = 1020 steps
  # per epoch; 10 epochs. Fine-tune from checkpoints/stage_1_clean/best.pt with
  # base_qwen (Qwen 2048-d single-token conditioning).
  steps: 10204
  log_every: 25
  save_every: 1000
  eval_every_epochs: 1
  save_best: true
  output_dir: checkpoints/stage_2
  log_file: checkpoints/stage_2/train.log

  optimizer:
    name: adamw
    fused: true
    lr: 1.0e-4
    betas: [0.9, 0.95]
    weight_decay: 0.03

  scheduler:
    type: cosine
    warmup_steps: 500

  grad_clip: 1.0
  activation_checkpointing: false
  gradient_accumulation: 1

  batch:
    auto_probe: false
    preferred_micro_batch: 1024
    max_vram_gb: 74

  ema:
    enabled: true
    device: cpu
    decay: 0.999
    update_every: 1

  flow:
    timestep_sampling: uniform
    loss: mse

  tile_loss:
    enabled: true
    weight: 0.03
    max_t: 0.7
    border_width: 2

  dataset: configs/data/stage_2.yaml
  text_mmap: data/build/stage2_32/text_embeddings.f32.mmap
