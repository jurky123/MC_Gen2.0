# Stage 3 v2 (frozen variant): leak-free splits + premultiplied RGBA.
# Init from checkpoints/stage_2_grounded_k1_v2/best.pt via --init-from.
train:
  precision: bf16
  compile: false
  seed: 0
  steps: 400
  log_every: 25
  save_every: 1000
  eval_every_epochs: 1
  save_best: true
  output_dir: checkpoints/stage_3_frozen_v2
  log_file: checkpoints/stage_3_frozen_v2/train.log
  optimizer:
    name: adamw
    fused: true
    lr: 3.0e-05
    betas:
    - 0.9
    - 0.95
    weight_decay: 0.03
  scheduler:
    type: cosine
    warmup_steps: 100
  grad_clip: 1.0
  activation_checkpointing: false
  gradient_accumulation: 4
  freeze_backbone: true
  batch:
    auto_probe: false
    preferred_micro_batch: 256
    max_vram_gb: 74
    num_workers: 8
    prefetch_factor: 4
  ema:
    enabled: true
    device: cpu
    decay: 0.999
    update_every: 8
  flow:
    timestep_sampling: uniform
    loss: mse
  tile_loss:
    enabled: true
    weight: 0.03
    max_t: 0.7
    border_width: 2
  dataset: configs/data/stage_3_v2.yaml
  text_tower:
    model_name: /home/iflab/models/Qwen3-8B
    max_length: 512
    dtype: bfloat16
    device: cuda:1
    layers:
    - 9
    - 18
    - 27
    instruction: ''
    add_generation_prompt: true
    enable_thinking: false
    revision: ''
  select_metric: flow_mse
