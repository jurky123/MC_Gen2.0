train:
  precision: bf16
  compile: true

  seed: 0
  steps: 20000
  log_every: 25
  save_every: 2000
  val_every: 500
  output_dir: checkpoints/stage_d

  optimizer:
    name: adamw
    fused: true
    lr: 5.0e-5
    betas: [0.9, 0.95]
    weight_decay: 0.03

  scheduler:
    type: cosine
    warmup_steps: 200

  grad_clip: 1.0
  activation_checkpointing: false
  gradient_accumulation: 1

  batch:
    auto_probe: true
    preferred_micro_batch: 128
    max_vram_gb: 7.2

  ema:
    enabled: true
    device: cpu
    decay: 0.999
    update_every: 1

  flow:
    timestep_sampling: uniform
    loss: mse

  tile_loss:
    enabled: true
    weight: 0.03
    max_t: 0.7
    border_width: 2

  dataset: configs/data/stage_d.yaml
  text_mmap: data/build/mc_d/text_embeddings.f32.mmap