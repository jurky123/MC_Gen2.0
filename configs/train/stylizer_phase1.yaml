# Stylizer Phase 1: frozen backbone, train the reference path only.
train:
  precision: bf16
  compile: false
  seed: 0
  steps: 1500
  log_every: 25
  save_every: 250
  eval_every_epochs: 1
  save_best: true
  select_metric: flow_mse
  output_dir: checkpoints/stylizer_phase1
  log_file: checkpoints/stylizer_phase1/train.log
  optimizer:
    name: adamw
    fused: true
    lr: 1.0e-4
    betas: [0.9, 0.95]
    weight_decay: 0.01
  scheduler:
    type: cosine
    warmup_steps: 100
  grad_clip: 1.0
  gradient_accumulation: 4
  freeze_backbone: true
  ref_dropout: 0.1
  batch:
    auto_probe: false
    preferred_micro_batch: 64
    max_vram_gb: 74
    num_workers: 8
    prefetch_factor: 4
  ema:
    enabled: false
  flow:
    timestep_sampling: uniform
    loss: mse
  tile_loss:
    enabled: true
    weight: 0.03
    max_t: 0.7
    border_width: 2
  dataset: configs/data/stylizer.yaml
  text_tower:
    model_name: /home/iflab/models/Qwen3-8B
    max_length: 512
    dtype: bfloat16
    device: cuda:1
    layers: [9, 18, 27]
    instruction: ""
    add_generation_prompt: true
    enable_thinking: false
    revision: ""
