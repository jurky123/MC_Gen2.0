[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mc-texture-gen"
version = "0.3.0"
description = "Pixel-space Rectified Flow Transformer for Minecraft / voxel-game low-res texture generation"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "torchvision",
    "numpy",
    "pillow",
    "pyyaml",
    "einops",
    "transformers",
    "pyarrow",
    "pandas",
    "safetensors",
    "fastapi",
    "uvicorn",
]

[project.scripts]
mcgen = "mcgen.cli:main"
mcgen-legacy-train = "train.train:main"
mcgen-legacy-sample = "infer.sample:main"
mcgen-legacy-api = "infer.api:main"

[tool.setuptools]
packages = ["mcgen", "data", "model", "train", "infer", "eval"]
py-modules = ["config"]

[project.optional-dependencies]
test = ["pytest", "httpx"]

[tool.setuptools.package-dir]
"" = "src"
